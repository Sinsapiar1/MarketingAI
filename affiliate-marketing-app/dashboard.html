<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AffiliatePro – Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Configuración Firebase -->
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
</head>
<body class="dashboard-body">
    <aside class="sidebar">
        <h2 class="logo">Affiliate<span>Pro</span></h2>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="#stats" class="active">Estadísticas</a></li>
                <li><a href="#validator">Validador de Ofertas</a></li>
                <li><a href="#avatars">Generador de Avatares</a></li>
                <li><a href="#funnels">Funnel Architect</a></li>
                <li><a href="#profit">Calculadora de Profit</a></li>
                <li><a href="#settings">Configuración</a></li>
                <li><button id="logoutBtn" class="btn small">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <!-- Stats Section -->
        <section id="stats" class="section active">
            <h1>Bienvenido, <span id="username"></span></h1>
            <div id="dashboardStats"></div>
        </section>

        <!-- Offer Validator -->
        <section id="validator" class="section">
            <h2>Validador de Ofertas</h2>
            <div id="offerValidatorRoot"></div>
        </section>

        <!-- Avatar Generator -->
        <section id="avatars" class="section">
            <h2>Generador de Avatares</h2>
            <div id="avatarGeneratorRoot"></div>
        </section>

        <!-- Funnel Architect -->
        <section id="funnels" class="section">
            <h2>Funnel Architect</h2>
            <div id="funnelArchitectRoot"></div>
        </section>

        <!-- Profit Calculator -->
        <section id="profit" class="section">
            <h2>Calculadora de Profit</h2>
            <div id="profitCalculatorRoot"></div>
        </section>

        <!-- Settings -->
        <section id="settings" class="section">
            <h2>Configuración</h2>
            <button id="toggleTheme" class="btn small">Cambiar Tema</button>
        </section>
    </main>

    <!-- Core & Modules -->
    <script src="js/auth.js"></script>
    <script src="js/modules/content-generator.js"></script>
    <script src="js/modules/product-detector.js"></script>
    <script src="js/modules/offer-validator.js"></script>
    <script src="js/modules/avatar-generator.js"></script>
    <script src="js/modules/funnel-architect.js"></script>
    <script src="js/modules/profit-calculator.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Sidebar navigation logic
        const sections = document.querySelectorAll('.section');
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.querySelector(link.getAttribute('href'));
                if (!target) return;
                sections.forEach(sec => sec.classList.remove('active'));
                target.classList.add('active');
                document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
                link.classList.add('active');
            });
        });

        // Load user name
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                document.getElementById('username').textContent = user.email;
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            const authM = new AuthManager();
            authM.logout();
        });

        // Theme toggle
        document.getElementById('toggleTheme').addEventListener('click', () => {
            document.body.classList.toggle('dark');
        });
    </script>
</body>
</html>
